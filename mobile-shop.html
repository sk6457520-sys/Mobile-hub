<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OLD MOBILE HUB</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.header{
    background:white;
    text-align:center;
    padding:25px 10px;
    box-shadow:0 2px 8px #ccc;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    font-size:17px;
    font-weight:bold;
    line-height:1.5;
}

.mobile-list{
    max-width:600px;
    margin:auto;
    padding:10px;
}

.mobile-box{
    background:white;
    margin:15px 5px;
    padding:15px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 10px #ccc;
    cursor:pointer;
}

.mobile-box img{
    width:100%;
    height:250px;
    object-fit:contain;
}

.price{
    font-size:24px;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">

<h1>OLD MOBILE HUB</h1>

<p>
सभी मोबाइल नए हैं सील पैक<br>
ऑर्डर करने के लिए मोबाइल पर टैब करें
</p>

</div>


<div class="mobile-list">

<div class="mobile-box"
onclick="window.location.href='customer-details.html'">

<img src="mobile1.jpg" alt="Mobile 1">

<div class="price">₹15,999</div>

</div>


<div class="mobile-box"
onclick="window.location.href='customer-details.html'">

<img src="mobile2.jpg" alt="Mobile 2">

<div class="price">₹18,999</div>

</div>


<div class="mobile-box"
onclick="window.location.href='customer-details.html'">

<img src="mobile3.jpg" alt="Mobile 3">

<div class="price">₹22,999</div>

</div>


<div class="mobile-box"
onclick="window.location.href='customer-details.html'">

<img src="mobile4.jpg" alt="Mobile 4">

<div class="price">₹25,999</div>

</div>

</div>

</body>
</html>
