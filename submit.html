<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAYMENT & ORDER</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:28px 15px;
}

.header h1{
    margin:0;
    font-size:27px;
    letter-spacing:1px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px 12px 35px;
}

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}


/* ORDER INFORMATION */

.info{
    text-align:center;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    line-height:1.7;
}

.info-title{
    font-size:21px;
    font-weight:bold;
    margin-bottom:10px;
}


/* PAYMENT AMOUNT */

.amount{
    text-align:center;
    margin-top:25px;
    font-size:28px;
    font-weight:bold;
}


/* PAY BUTTON */

.pay-button{
    display:block;
    width:100%;
    margin-top:18px;
    padding:16px;
    background:#111827;
    color:white;
    text-align:center;
    text-decoration:none;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}


/* ORDER NOW */

.order-button{
    display:block;
    width:100%;
    margin-top:15px;
    padding:15px;
    background:#d1d5db;
    color:#777;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    pointer-events:none;
}


/* BACK */

.back-button{
    display:block;
    width:100%;
    margin-top:15px;
    padding:14px;
    background:#e5e7eb;
    color:#111827;
    text-align:center;
    text-decoration:none;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
}

.note{
    text-align:center;
    margin-top:15px;
    font-size:13px;
    color:#666;
    line-height:1.5;
}

</style>

</head>


<body>


<div class="header">

    <h1>PAYMENT & ORDER</h1>

</div>


<div class="container">

<div class="card">


<!-- ORDER INFORMATION -->

<div class="info">

    <div class="info-title">
        📦 मोबाइल ऑर्डर की जानकारी
    </div>

    मोबाइल ऑर्डर करने के लिए
    <strong>₹99 डिलीवरी चार्ज</strong>
    देना होगा।

    <br><br>

    मोबाइल की कीमत आपको
    <strong>डिलीवरी के समय डिलीवरी बॉय को देनी होगी।</strong>

</div>


<!-- AMOUNT -->

<div class="amount">

    ₹99

</div>


<!-- PAY BUTTON -->

<a
href="upi://pay?pa=s.kumar64000@ptyes&pn=Sonu%20Kumar&am=99.00&cu=INR"
class="pay-button">

    💳 PAY ₹99

</a>


<div class="note">

    PAY ₹99 पर टैब करने के बाद आपके फोन में
    उपलब्ध UPI / Payment App खुल जाएगा।

</div>


<!-- ORDER NOW -->

<a
href="order-success.html"
class="order-button">

    ORDER NOW

</a>


<!-- BACK -->

<a
href="customer-details.html"
class="back-button">

    ← BACK

</a>


</div>

</div>


</body>

</html>
