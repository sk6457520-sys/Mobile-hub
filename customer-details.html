<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUSTOMER DETAILS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}


/* HEADER */

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:28px 15px;
}

.header h1{
    margin:0;
    font-size:28px;
    letter-spacing:1px;
}


/* CONTAINER */

.container{
    max-width:600px;
    margin:auto;
    padding:20px 12px 35px;
}


/* CARD */

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}


/* LABEL */

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
    font-size:15px;
}


/* INPUT */

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#111827;
}


/* SHOP ADDRESS */

.shop{
    margin-top:25px;
    padding:18px;
    background:#f8fafc;
    border-radius:12px;
    border:1px solid #e5e7eb;
    line-height:1.7;
}

.shop-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}


/* MAP BUTTON */

.map-button{
    display:block;
    margin-top:15px;
    padding:14px;
    background:#111827;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:9px;
    font-weight:bold;
}


/* FORM BUTTONS */

.form-buttons{
    display:flex;
    gap:12px;
    margin-top:15px;
}


/* BACK + SUBMIT */

.back-button,
.submit-button{
    flex:1;
    padding:14px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    text-align:center;
}


/* BACK BUTTON */

.back-button{
    background:#e5e7eb;
    color:#111827;
    text-decoration:none;
}


/* SUBMIT BUTTON */

.submit-button{
    background:#111827;
    color:white;
    border:none;
    cursor:pointer;
}


/* SUBMIT DISABLED */

.submit-button:disabled{
    background:#cbd5e1;
    color:#64748b;
    cursor:not-allowed;
}


/* MOBILE */

@media(max-width:480px){

    .header h1{
        font-size:25px;
    }

    .card{
        padding:18px;
    }

    .form-buttons{
        gap:8px;
    }

    .back-button,
    .submit-button{
        font-size:15px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>CUSTOMER DETAILS</h1>

</div>


<!-- MAIN CONTAINER -->

<div class="container">

<div class="card">


<!-- NAME -->

<label>NAME</label>

<input
type="text"
id="name"
placeholder="Enter your name"
autocomplete="name">


<!-- ADDRESS -->

<label>ADDRESS</label>

<input
type="text"
id="address"
placeholder="Enter your full address"
autocomplete="street-address">


<!-- PIN CODE -->

<label>PIN CODE</label>

<input
type="text"
id="pincode"
placeholder="Enter 6 digit PIN code"
inputmode="numeric"
maxlength="6">


<!-- MOBILE NUMBER -->

<label>MOBILE NUMBER</label>

<input
type="tel"
id="mobile"
placeholder="Enter 10 digit mobile number"
inputmode="numeric"
maxlength="10"
autocomplete="tel">


<!-- SHOP ADDRESS -->

<div class="shop">

    <div class="shop-title">
        SHOP ADDRESS
    </div>

    Shop Address - Nathani Market 2nd Floor 2178,<br>
    XRC9+6QP Nathani Heights,<br>
    Shop No. 2248, 2nd Floor, Nathani Building,<br>
    Lamington Road,<br>
    Marzban Parsi Colony,<br>
    Dalal Estate,<br>
    Mumbai Central, Mumbai,<br>
    Maharashtra - 400008

</div>


<!-- MAP -->

<a
href="https://www.google.com/maps/search/?api=1&query=Nathani+Market+Mumbai"
target="_blank"
class="map-button">

📍 Map of Nathani Market

</a>


<!-- BACK + SUBMIT -->

<div class="form-buttons">


<a
href="mobile-shop.html"
class="back-button">

← BACK

</a>


<button
type="button"
id="submitBtn"
class="submit-button"
disabled>

SUBMIT

</button>


</div>


</div>

</div>


<!-- JAVASCRIPT -->

<script>


const nameInput =
document.getElementById("name");


const addressInput =
document.getElementById("address");


const pincodeInput =
document.getElementById("pincode");


const mobileInput =
document.getElementById("mobile");


const submitBtn =
document.getElementById("submitBtn");



/* CHECK ALL DETAILS */

function checkForm(){

    const name =
    nameInput.value.trim();


    const address =
    addressInput.value.trim();


    const pincode =
    pincodeInput.value.trim();


    const mobile =
    mobileInput.value.trim();


    const valid =

        name !== "" &&

        address !== "" &&

        /^[0-9]{6}$/.test(pincode) &&

        /^[0-9]{10}$/.test(mobile);


    submitBtn.disabled = !valid;

}



/* CHECK WHEN USER TYPES */

nameInput.addEventListener(
    "input",
    checkForm
);


addressInput.addEventListener(
    "input",
    checkForm
);


pincodeInput.addEventListener(
    "input",
    checkForm
);


mobileInput.addEventListener(
    "input",
    checkForm
);



/* SUBMIT BUTTON */

submitBtn.addEventListener(
    "click",
    function(){

        window.location.href =
        "submit.html";

    }
);


/* INITIAL CHECK */

checkForm();


</script>


</body>

    </html>
