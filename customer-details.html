<style>

*{

body{

.header{

}

.shop{

    padding:18px;
    background:#f8fafc;
    border-radius:12px;

.shop-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;

.map-button{

    padding:14px;
    background:#111827;
    color:white;
    text-align:center;
    text-decoration:none;

    font-weight:bold;

.back-button{
