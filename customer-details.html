<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUSTOMER DETAILS</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px 15px;
}

h1{
    text-align:center;
    background:white;
    padding:20px 10px;
    margin:0 0 25px;
    border-radius:10px;
    box-shadow:0 2px 8px #ccc;
    font-size:28px;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}

input, textarea{
    width:100%;
    padding:14px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:16px;
    box-sizing:border-box;
}

textarea{
    height:100px;
}

.shop{
    background:white;
    margin-top:25px;
    padding:18px;
    border-radius:10px;
    box-shadow:0 2px 8px #ccc;
    line-height:1.6;
}

.map{
    display:block;
    margin-top:15px;
    padding:13px;
    background:#111;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:7px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>CUSTOMER DETAILS</h1>

<label>NAME</label>
<input type="text" placeholder="Enter Name">

<label>ADDRESS</label>
<textarea placeholder="Enter Address"></textarea>

<label>PIN CODE</label>
<input type="number" placeholder="Enter PIN Code">

<label>MOBILE NUMBER</label>
<input type="tel" placeholder="Enter Mobile Number">

<div class="shop">

<strong>Shop Address -</strong><br><br>

Lamington Rd, Marzban Parsi Colony,
Dalal Estate, Mumbai Central,
Mumbai, Maharashtra 400008

href="https://www.google.com/maps/search/?api=1&query=Nathani+Market+Lamington+Road+Mumbai"
target="_blank">

Map of Nathani Market

</a>

</div>

</div>

</body>
