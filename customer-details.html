<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUSTOMER DETAILS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:28px 15px;
}

.header h1{
    margin:0;
    font-size:28px;
    letter-spacing:1px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px 12px 35px;
}

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
    font-size:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#111827;
}

.shop{
    margin-top:25px;
    padding:18px;
    background:#f8fafc;
    border-radius:12px;
    border:1px solid #e5e7eb;
    line-height:1.7;
}

.shop-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.map-button{
    display:block;
    margin-top:15px;
    padding:14px;
    background:#111827;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:9px;
    font-weight:bold;
}

.form-buttons{
    display:flex;
    gap:12px;
    margin-top:15px;
}

.back-button,
.submit-button{
    flex:1;
    padding:14px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    text-align:center;
}

.back-button{
    background:#e5e7eb;
    color:#111827;
    text-decoration:none;
}

.submit-button{
    background:#111827;
    color:white;
    border:none;
    cursor:pointer;
}

</style>

</head>


<body>


<div class="header">

<h1>CUSTOMER DETAILS</h1>

</div>


<div class="container">

<div class="card">


<label>NAME</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required>


<label>ADDRESS</label>

<input
type="text"
id="address"
placeholder="Enter your full address"
required>


<label>PIN CODE</label>

<input
type="text"
id="pincode"
placeholder="Enter PIN code"
inputmode="numeric"
maxlength="6"
required>


<label>MOBILE NUMBER</label>

<input
type="tel"
id="mobile"
placeholder="Enter mobile number"
inputmode="numeric"
maxlength="10"
required>


<!-- SHOP ADDRESS -->

<div class="shop">

<div class="shop-title">
SHOP ADDRESS
</div>

Shop Address - Nathani Market 2nd Floor 2178,<br>
XRC9+6QP Nathani Heights,<br>
Shop No. 2248, 2nd Floor, Nathani Building,<br>
Lamington Road,<br>
Marzban Parsi Colony,<br>
Dalal Estate,<br>
Mumbai Central, Mumbai,<br>
Maharashtra - 400008

</div>


<!-- MAP -->

<a
href="https://www.google.com/maps/search/?api=1&query=Nathani+Market+Mumbai"
target="_blank"
class="map-button">

📍 Map of Nathani Market

</a>


<!-- BACK + SUBMIT -->

<div class="form-buttons">

<a
href="mobile-shop.html"
class="back-button">

← BACK

</a>


<button
type="button"
class="submit-button"
onclick="submitDetails()">

SUBMIT

</button>

</div>


</div>

</div>


<script>

function submitDetails(){

    var name = document.getElementById("name").value.trim();
    var address = document.getElementById("address").value.trim();
    var pincode = document.getElementById("pincode").value.trim();
    var mobile = document.getElementById("mobile").value.trim();


    /* CHECK EMPTY FIELDS */

    if(name === ""){

        alert("कृपया अपना NAME दर्ज करें।");
        return;

    }


    if(address === ""){

        alert("कृपया अपना ADDRESS दर्ज करें।");
        return;

    }


    if(pincode === ""){

        alert("कृपया अपना PIN CODE दर्ज करें।");
        return;

    }


    if(pincode.length !== 6 || !/^[0-9]+$/.test(pincode)){

        alert("कृपया सही 6 अंकों का PIN CODE दर्ज करें।");
        return;

    }


    if(mobile === ""){

        alert("कृपया अपना MOBILE NUMBER दर्ज करें।");
        return;

    }


    if(mobile.length !== 10 || !/^[0-9]+$/.test(mobile)){

        alert("कृपया सही 10 अंकों का MOBILE NUMBER दर्ज करें।");
        return;

    }


    /* ALL DETAILS CORRECT */

    window.location.href = "submit.html";

}

</script>


</body>

</html>
