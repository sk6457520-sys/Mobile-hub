<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUSTOMER DETAILS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:28px 15px;
}

.header h1{
    margin:0;
    font-size:28px;
    letter-spacing:1px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px 12px 35px;
}

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
    font-size:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#111827;
}


/* SHOP ADDRESS */

.shop{
    margin-top:25px;
    padding:18px;
    background:#f8fafc;
    border-radius:12px;
    border:1px solid #e5e7eb;
    line-height:1.7;
}

.shop-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}


/* MAP BUTTON */

.map-button{
    display:block;
    margin-top:15px;
    padding:14px;
    background:#111827;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:9px;
    font-weight:bold;
}


/* BACK + SUBMIT */

.form-buttons{
    display:flex;
    gap:12px;
    margin-top:15px;
}

.back-button,
.submit-button{
    flex:1;
    padding:14px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    text-align:center;
}

.back-button{
    background:#e5e7eb;
    color:#111827;
    text-decoration:none;
}

.submit-button{
    background:#111827;
    color:white;
    border:none;
    cursor:pointer;
}

</style>

</head>


<body>


<div class="header">

<h1>CUSTOMER DETAILS</h1>

</div>


<div class="container">

<div class="card">


<label>NAME</label>

<input
type="text"
placeholder="Enter your name">


<label>ADDRESS</label>

<input
type="text"
placeholder="Enter your full address">


<label>PIN CODE</label>

<input
type="number"
placeholder="Enter PIN code">


<label>MOBILE NUMBER</label>

<input
type="tel"
placeholder="Enter mobile number">


<!-- SHOP ADDRESS -->

<div class="shop">

<div class="shop-title">
SHOP ADDRESS
</div>

Shop Address - Nathani Market 2nd Floor 2178,<br>
XRC9+6QP Nathani Heights,<br>
Shop No. 2248, 2nd Floor, Nathani Building,<br>
Lamington Road,<br>
Marzban Parsi Colony,<br>
Dalal Estate,<br>
Mumbai Central, Mumbai,<br>
Maharashtra - 400008

</div>


<!-- MAP -->

<a
href="https://www.google.com/maps/search/?api=1&query=Nathani+Market+Mumbai"
target="_blank"
class="map-button">

📍 Map of Nathani Market

</a>


<!-- BACK + SUBMIT AT VERY BOTTOM -->

<div class="form-buttons">

<a
href="mobile-shop.html"
class="back-button">

← BACK

</a>


<button
type="button"
class="submit-button"
onclick="window.location.href='submit.html'">

SUBMIT

</button>

</div>


</div>

</div>


</body>

</html>
