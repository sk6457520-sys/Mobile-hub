<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OLD MOBILE HUB</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}


/* HEADER */

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:28px 15px;
}

.header h1{
    margin:0;
    font-size:30px;
    letter-spacing:1px;
}

.header p{
    margin:10px 0 0;
    font-size:16px;
    line-height:1.6;
    color:#e5e7eb;
}


/* MOBILE LIST */

.mobile-list{
    max-width:600px;
    margin:auto;
    padding:18px 12px 30px;
}


/* MOBILE CARD */

.mobile-card{
    background:white;
    margin-bottom:20px;
    padding:16px;
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
    text-align:center;
}


/* IMAGE */

.mobile-card a{
    display:block;
}

.mobile-card img{
    width:100%;
    height:260px;
    object-fit:contain;
    display:block;
    cursor:pointer;
}


/* MOBILE NAME */

.mobile-name{
    margin-top:12px;
    font-size:19px;
    font-weight:bold;
}


/* PRICE */

.price{
    margin-top:7px;
    font-size:22px;
    font-weight:bold;
    color:#111827;
}


/* INSTRUCTION */

.instruction{
    text-align:center;
    font-size:14px;
    color:#555;
    margin-top:5px;
}


/* MOBILE SCREEN */

@media(max-width:480px){

    .header h1{
        font-size:27px;
    }

    .header p{
        font-size:15px;
    }

    .mobile-card img{
        height:250px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>OLD MOBILE HUB</h1>

    <p>
        सभी मोबाइल नए एवं सील पैक हैं<br>
        ऑर्डर करने के लिए मोबाइल की फोटो पर टैब करें
    </p>

</div>



<!-- MOBILE LIST -->

<div class="mobile-list">


    <!-- MOBILE 1 -->

    <div class="mobile-card">

        <a href="customer-details.html">

            <img
            src="mobile1.jpg"
            alt="NOKIA 1100">

        </a>

        <div class="mobile-name">
            NOKIA 1100
        </div>

        <div class="price">
            ₹800
        </div>

        <div class="instruction">
            ऑर्डर करने के लिए फोटो पर टैब करें
        </div>

    </div>



    <!-- MOBILE 2 -->

    <div class="mobile-card">

        <a href="customer-details.html">

            <img
            src="mobile2.jpg"
            alt="NOKIYA 1600">

        </a>

        <div class="mobile-name">
            NOKIYA 1600
        </div>

        <div class="price">
            ₹1,000
        </div>

        <div class="instruction">
            ऑर्डर करने के लिए फोटो पर टैब करें
        </div>

    </div>



    <!-- MOBILE 3 -->

    <div class="mobile-card">

        <a href="customer-details.html">

            <img
            src="mobile3.jpg"
            alt="NOKIA 1110">

        </a>

        <div class="mobile-name">
            NOKIA 1110
        </div>

        <div class="price">
            ₹800
        </div>

        <div class="instruction">
            ऑर्डर करने के लिए फोटो पर टैब करें
        </div>

    </div>


</div>


</body>

</html>
